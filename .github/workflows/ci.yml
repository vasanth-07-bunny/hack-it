name: Abhiyantrix CI/CD & Automated Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & Monorepo Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: TypeCheck & Build Shared Types & Packages
        run: npm run build

      - name: Run Backend Unit & Integration Tests (Vitest)
        run: npm run test:api

      - name: Run End-to-End Platform Verification
        run: npm run test:e2e
