steps:
  # 1. Build Docker image with Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/abhiyantrix-engine:$COMMIT_SHA', '.']

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/abhiyantrix-engine:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with Managed Autoscaling
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'abhiyantrix-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/abhiyantrix-engine:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/abhiyantrix-engine:$COMMIT_SHA'
